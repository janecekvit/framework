name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - C++${{ matrix.cxx_standard }}${{ matrix.osx_deployment_target && format(' - macOS {0}', matrix.osx_deployment_target) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC - C++20
          - os: windows-latest
            compiler: msvc
            cmake_generator: "Visual Studio 18 2026"
            cxx_standard: "20"

          # Windows MSVC - C++23
          - os: windows-latest
            compiler: msvc
            cmake_generator: "Visual Studio 18 2026"
            cxx_standard: "23"

          # Ubuntu GCC - C++20
          - os: ubuntu-latest
            compiler: gcc
            cmake_generator: "Unix Makefiles"
            cc: gcc-14
            cxx: g++-14
            cxx_standard: "20"

          # Ubuntu GCC - C++23
          - os: ubuntu-latest
            compiler: gcc
            cmake_generator: "Unix Makefiles"
            cc: gcc-14
            cxx: g++-14
            cxx_standard: "23"

          # Ubuntu Clang - C++20
          - os: ubuntu-latest
            compiler: clang
            cmake_generator: "Unix Makefiles"
            cc: clang-18
            cxx: clang++-18
            cxx_standard: "20"

          # Ubuntu Clang - C++23
          - os: ubuntu-latest
            compiler: clang
            cmake_generator: "Unix Makefiles"
            cc: clang-18
            cxx: clang++-18
            cxx_standard: "23"

          # macOS Clang - C++20
          - os: macos-latest
            compiler: clang
            cmake_generator: "Unix Makefiles"
            cxx_standard: "20"

          # macOS Clang - C++23
          - os: macos-latest
            compiler: clang
            cmake_generator: "Unix Makefiles"
            cxx_standard: "23"

          # macOS Clang - C++23 with Deployment Target 12.0
          - os: macos-latest
            compiler: clang
            cmake_generator: "Unix Makefiles"
            cxx_standard: "23"
            osx_deployment_target: "12.0"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup GCC/Clang (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        if ("${{ matrix.compiler }}" -eq "gcc") {
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
        } elseif ("${{ matrix.compiler }}" -eq "clang") {
          sudo apt-get update
          sudo apt-get install -y clang-18
        }
        echo "CC=${{ matrix.cc }}" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "CXX=${{ matrix.cxx }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    # googletest comes from FetchContent in CMakeLists.txt, so no package manager is needed.
    - name: Configure CMake
      shell: pwsh
      run: |
        $deploymentTargetArg = ""
        if ("${{ matrix.osx_deployment_target }}" -ne "") {
          $deploymentTargetArg = "-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.osx_deployment_target }}"
        }

        cmake -S . -B build `
          -G "${{ matrix.cmake_generator }}" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} `
          $deploymentTargetArg

    - name: Build
      shell: pwsh
      run: |
        cmake --build build --config Release --parallel

    - name: Test
      shell: pwsh
      run: |
        ctest --test-dir build --build-config Release --output-on-failure --parallel --timeout 30

    # Consumes framework::framework the way an external project does, both from the
    # installed package and as an add_subdirectory subproject.
    - name: Check consumer usage
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $installPrefix = Join-Path "${{ runner.temp }}" "framework-install"

        cmake --install build --config Release --prefix $installPrefix

        cmake -S tests/package -B build-package-installed `
          -G "${{ matrix.cmake_generator }}" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$installPrefix"
        cmake --build build-package-installed --config Release

        cmake -S tests/package -B build-package-subproject `
          -G "${{ matrix.cmake_generator }}" `
          -DCMAKE_BUILD_TYPE=Release `
          -DFRAMEWORK_SOURCE_DIR="${{ github.workspace }}"
        cmake --build build-package-subproject --config Release

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-cpp${{ matrix.cxx_standard }}${{ matrix.osx_deployment_target && format('-macos{0}', matrix.osx_deployment_target) || '' }}
        path: |
          build/Testing/
          build/**/test-results.xml
